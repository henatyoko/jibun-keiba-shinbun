name: ConoHa VPS Scheduled Sync

# 木曜17:00 JST(特別登録発表)・金曜17:00 JST(出馬表確定)・土曜8:00/21:00 JST・
# 日曜8:00/21:00 JST(当日のオッズ・馬体重・結果等)・月曜8:00 JST(通常データでの
# 確定結果配信を取り込む)にVPSを自動起動し、JvLinkToImporterサービスが取込を
# 終える時間だけ待ってから自動停止する。
on:
  schedule:
    - cron: "0 8 * * 4" # 木曜 17:00 JST
    - cron: "0 8 * * 5" # 金曜 17:00 JST
    - cron: "0 23 * * 5" # 土曜 8:00 JST
    - cron: "0 12 * * 6" # 土曜 21:00 JST
    - cron: "0 23 * * 6" # 日曜 8:00 JST
    - cron: "0 12 * * 0" # 日曜 21:00 JST
    - cron: "0 23 * * 0" # 月曜 8:00 JST
  workflow_dispatch:
    inputs:
      wait_minutes:
        description: "起動後にVPSを稼働させておく分数"
        required: false
        default: "25"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Start VPS, wait for JV-Link sync, then stop
        env:
          CONOHA_TENANT_ID: ${{ secrets.CONOHA_TENANT_ID }}
          CONOHA_API_USER_ID: ${{ secrets.CONOHA_API_USER_ID }}
          CONOHA_API_PASSWORD: ${{ secrets.CONOHA_API_PASSWORD }}
          WAIT_MINUTES: ${{ inputs.wait_minutes || '25' }}
        run: |
          set -e

          TOKEN=$(curl -sS -i -X POST "https://identity.c3j1.conoha.io/v3/auth/tokens" \
            -H "Content-Type: application/json" \
            -d "{\"auth\":{\"identity\":{\"methods\":[\"password\"],\"password\":{\"user\":{\"id\":\"$CONOHA_API_USER_ID\",\"password\":\"$CONOHA_API_PASSWORD\"}}},\"scope\":{\"project\":{\"id\":\"$CONOHA_TENANT_ID\"}}}}" \
            | grep -i "^x-subject-token:" | awk '{print $2}' | tr -d '\r')

          if [ -z "$TOKEN" ]; then
            echo "::error::認証に失敗しました"
            exit 1
          fi
          echo "::add-mask::$TOKEN"

          SERVER_ID=$(curl -sS "https://compute.c3j1.conoha.io/v2.1/servers/detail" -H "X-Auth-Token: $TOKEN" | jq -r '.servers[0].id')
          echo "対象サーバー: $SERVER_ID"

          echo "VPSを起動します..."
          curl -sS -X POST "https://compute.c3j1.conoha.io/v2.1/servers/$SERVER_ID/action" \
            -H "X-Auth-Token: $TOKEN" -H "Content-Type: application/json" \
            -d '{"os-start": null}'

          echo "${WAIT_MINUTES}分待機してJV-Linkの取込を待ちます..."
          sleep "$((WAIT_MINUTES * 60))"

          echo "VPSを停止します..."
          curl -sS -X POST "https://compute.c3j1.conoha.io/v2.1/servers/$SERVER_ID/action" \
            -H "X-Auth-Token: $TOKEN" -H "Content-Type: application/json" \
            -d '{"os-stop": null}'

          echo "完了"
