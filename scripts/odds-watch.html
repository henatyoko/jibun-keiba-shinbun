<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>直前オッズ監視</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f3ef;
    --surface: #fcfcfb;
    --border: #e2e0d8;
    --text: #0b0b0b;
    --text-2: #52514e;
    --text-3: #8a8983;
    --accent: #2a78d6;
    --accent-soft: #e3eefb;
    --alert: #d03b3b;
    --alert-soft: #fbe7e6;
    --good: #1a7f4b;
    --spark: #52514e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #121211;
      --surface: #1a1a19;
      --border: #2e2e2c;
      --text: #ffffff;
      --text-2: #c3c2b7;
      --text-3: #8a8983;
      --accent: #3987e5;
      --accent-soft: #1d2b3d;
      --alert: #e66767;
      --alert-soft: #3a2020;
      --good: #4cc38a;
      --spark: #c3c2b7;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-size: 14px;
  }
  header {
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
    padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--surface);
  }
  header h1 { font-size: 18px; margin: 0; }
  header .clock { font-variant-numeric: tabular-nums; font-size: 16px; font-weight: 600; }
  header .settings { color: var(--text-3); font-size: 12px; }
  header .conn { margin-left: auto; font-size: 12px; color: var(--text-3); }
  header .conn.bad { color: var(--alert); font-weight: 600; }

  .layout { display: grid; grid-template-columns: 240px 1fr 300px; gap: 16px; padding: 16px 20px; align-items: start; }
  @media (max-width: 1100px) { .layout { grid-template-columns: 200px 1fr; } .feed { grid-column: 1 / -1; } }
  @media (max-width: 700px) { .layout { grid-template-columns: 1fr; padding: 12px 16px; } }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
  .panel h2 { font-size: 13px; color: var(--text-2); margin: 0; padding: 10px 14px; border-bottom: 1px solid var(--border); font-weight: 600; }

  .races { max-height: calc(100vh - 110px); overflow-y: auto; }
  .race-item {
    display: grid; grid-template-columns: 44px 1fr auto; gap: 8px; align-items: center;
    padding: 8px 12px; border-bottom: 1px solid var(--border); cursor: pointer; width: 100%;
    background: none; border-left: 3px solid transparent; border-top: 0; border-right: 0; color: inherit; font: inherit; text-align: left;
  }
  .race-item:hover { background: var(--accent-soft); }
  .race-item.selected { background: var(--accent-soft); border-left-color: var(--accent); }
  .race-item.done { color: var(--text-3); }
  .race-item .t { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--text-2); }
  .race-item .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .race-item .n small { color: var(--text-3); margin-left: 4px; }
  .badge { font-size: 11px; padding: 1px 6px; border-radius: 999px; white-space: nowrap; }
  .badge.watching { background: var(--accent); color: #fff; }
  .badge.alert { background: var(--alert); color: #fff; }
  .badge.post { background: var(--border); color: var(--text-2); }
  .phase { font-size: 11px; padding: 1px 6px; border-radius: 4px; margin-left: 4px; font-weight: 600; }
  .phase.pre { background: var(--alert); color: #fff; }
  .phase.post { background: var(--border); color: var(--text-2); }

  .main { padding: 16px 18px; min-height: 400px; }
  .race-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .race-head h3 { margin: 0; font-size: 20px; }
  .race-head .sub { color: var(--text-2); }
  .stats { display: flex; gap: 28px; flex-wrap: wrap; margin: 14px 0 6px; }
  .stat .k { font-size: 12px; color: var(--text-2); }
  .stat .v { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .v small { font-size: 13px; font-weight: 500; color: var(--text-2); margin-left: 4px; }
  .note { color: var(--text-3); font-size: 12px; margin: 4px 0 12px; }

  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th { font-size: 11px; color: var(--text-2); font-weight: 600; text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th.l, td.l { text-align: left; }
  td { padding: 6px 8px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; }
  tr.flag td { background: var(--alert-soft); }
  .flag-icon { color: var(--alert); font-weight: 700; margin-right: 2px; }
  .flag-icon.post { color: var(--text-3); }
  .down { color: var(--good); font-weight: 600; }
  .up { color: var(--text-3); }
  .bar-cell { width: 34%; min-width: 120px; }
  .bar-wrap { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
  .bar { height: 10px; border-radius: 0 4px 4px 0; background: var(--accent); }
  .bar.flag { background: var(--alert); }
  .bar-val { min-width: 64px; text-align: right; }
  svg.spark { display: block; }
  svg.spark polyline { fill: none; stroke: var(--spark); stroke-width: 1.5; }
  svg.spark circle.end { fill: var(--spark); }
  svg.spark .hit { fill: transparent; }
  svg.spark .hit:hover { fill: var(--accent); }
  .empty { color: var(--text-3); padding: 40px 0; text-align: center; }

  .feed { max-height: calc(100vh - 110px); overflow-y: auto; }
  .alert-item { padding: 10px 14px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .alert-item:hover { background: var(--alert-soft); }
  .alert-item .top { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-2); }
  .alert-item .kind { color: var(--alert); font-weight: 700; }
  .alert-item.post .kind, .alert-item.post .body { color: var(--text-3); }
  .rank { display: inline-block; min-width: 38px; text-align: center; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px; }
  .rank.win { background: var(--accent); color: #fff; }
  .rank.place { background: var(--accent-soft); color: var(--accent); }
  .rank.out { color: var(--text-3); }
  .alert-item .rank { margin-left: 6px; }
  .score { padding: 8px 12px 10px; }
  .score table th, .score table td { padding: 4px 4px; font-size: 12px; }
  .score .grp td { color: var(--text-2); font-size: 11px; font-weight: 600; padding-top: 8px; text-align: left; border-bottom: 0; }
  .score .foot { color: var(--text-3); font-size: 11px; margin-top: 6px; }
  .result-line { font-weight: 700; margin-left: 4px; }
  .alert-item .body { margin-top: 3px; }
  .alert-item.fresh { animation: flash 2s ease-out; }
  @keyframes flash { from { background: var(--alert-soft); } to { background: transparent; } }
</style>
</head>
<body>
<header>
  <h1>直前オッズ監視</h1>
  <span class="clock" id="clock">--:--:--</span>
  <span class="settings" id="settings"></span>
  <span class="conn" id="conn">接続中…</span>
</header>
<div class="layout">
  <nav class="panel races" aria-label="レース一覧">
    <h2>今日のレース</h2>
    <div id="raceList"></div>
  </nav>
  <main class="panel main" id="main"><div class="empty">読み込み中…</div></main>
  <aside class="panel feed" aria-label="アラート">
    <h2>答え合わせ(今日)</h2>
    <div class="score" id="score"></div>
    <h2>アラート(新しい順)</h2>
    <div id="feed"><div class="empty">まだありません</div></div>
  </aside>
</div>

<script>
let state = null;
let selectedId = null;       // 利用者がクリックで選んだレース(未選択なら自動で直近のレースを表示)
const seenAlerts = new Set();
let firstLoad = true;

const man = (yen) => `${Math.round(yen / 10000).toLocaleString()}万円`;
const hm = (iso) => { const d = new Date(iso); return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };
const hms = (s) => s.slice(11, 19);
const KIND = { big: "大口", drop: "急落", slide: "じわじわ下落" };
const PHASE = { pre: "締切前(買える)", post: "締切後" };
// 着順バッジ。2・3着が伏せられている間(complete=false)に1着以外なら「確認中」
function rankBadge(race, umaban) {
  if (!race.result) return "";
  const r = race.result.ranks[umaban];
  if (r === 1) return `<span class="rank win">1着</span>`;
  if (r === 2 || r === 3) return `<span class="rank place">${r}着</span>`;
  if (!race.result.complete) return `<span class="rank out">確認中</span>`;
  return `<span class="rank out">${r ? `${r}着` : "着外"}</span>`;
}
const resultLine = (race) => {
  if (!race.result) return "";
  const order = Object.entries(race.result.ranks).filter(([, r]) => r <= 3).sort((a, b) => a[1] - b[1]).map(([u]) => Number(u));
  return `<span class="result-line">結果 ${order.join("-")}${race.result.complete ? "" : "(2・3着確認中)"} ・ 単勝${race.result.tanshoPayout ?? "?"}円</span>`;
};
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function autoRace() {
  const races = state.races;
  return races.filter((r) => r.state === "watching").sort((a, b) => new Date(a.post) - new Date(b.post))[0]
    ?? races.find((r) => r.state === "waiting")
    ?? races.at(-1);
}

function renderList() {
  const current = selectedId ?? autoRace()?.id;
  document.getElementById("raceList").innerHTML = state.races.map((r) => `
    <button class="race-item ${r.state} ${r.id === current ? "selected" : ""}" data-id="${r.id}">
      <span class="t">${hm(r.post)}</span>
      <span class="n">${esc(r.label)}<small>${esc(r.name)}</small></span>
      <span>
        ${(() => {
          const pre = r.alerts.filter((a) => a.phase === "pre").length;
          const post = r.alerts.length - pre;
          return (pre ? `<span class="badge alert">⚠ ${pre}</span>` : "") + (post ? `<span class="badge post" title="締切後のアラート">${post}</span>` : "");
        })()}
        ${r.state === "watching" ? `<span class="badge watching">監視中</span>` : ""}
      </span>
    </button>`).join("");
}

// オッズ推移の小さな折れ線(下に行くほどオッズが下がる=お金が入っている)
function spark(odds, times) {
  const pts = odds.map((o, i) => [i, o]).filter(([, o]) => o != null);
  const W = 110, H = 26, P = 3;
  if (pts.length < 2) return `<svg class="spark" width="${W}" height="${H}"></svg>`;
  const vals = pts.map(([, o]) => o);
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const x = (i) => P + (i / (odds.length - 1)) * (W - P * 2);
  const y = (o) => hi === lo ? H / 2 : P + ((hi - o) / (hi - lo)) * (H - P * 2);
  const line = pts.map(([i, o]) => `${x(i).toFixed(1)},${y(o).toFixed(1)}`).join(" ");
  const [li, lo2] = pts.at(-1);
  const hits = pts.map(([i, o]) => `<circle class="hit" cx="${x(i)}" cy="${y(o)}" r="4"><title>${hms(times[i])}  ${o}倍</title></circle>`).join("");
  return `<svg class="spark" width="${W}" height="${H}" role="img" aria-label="オッズ推移">
    <polyline points="${line}"/><circle class="end" cx="${x(li)}" cy="${y(lo2)}" r="2.5"/>${hits}</svg>`;
}

function renderMain() {
  const race = state.races.find((r) => r.id === (selectedId ?? autoRace()?.id));
  const el = document.getElementById("main");
  if (!race) { el.innerHTML = `<div class="empty">今日のレースがありません</div>`; return; }

  const minsLeft = (new Date(race.post) - new Date()) / 60000;
  const countdown = race.state === "done" ? "終了" : minsLeft > 0 ? `発走まで ${Math.floor(minsLeft)}分${String(Math.floor((minsLeft % 1) * 60)).padStart(2, "0")}秒` : "発走";
  const head = `
    <div class="race-head">
      <h3>${esc(race.label)} ${esc(race.name)}</h3>
      <span class="sub">${hm(race.post)}発走(締切${hm(race.close)}) ・ ${countdown}</span>
      ${resultLine(race)}
    </div>`;

  if (race.times.length === 0) {
    const msg = race.state === "waiting" ? `発走${state.settings.windowMin}分前から監視を始めます` : "オッズを取得できませんでした";
    el.innerHTML = head + `<div class="empty">${msg}</div>`;
    return;
  }

  const pool = race.pools.at(-1);
  const poolGain = pool - race.pools[0];
  const flaggedPre = new Set(race.alerts.filter((a) => a.phase === "pre").map((a) => a.umaban));
  const flaggedPost = new Set(race.alerts.filter((a) => a.phase !== "pre").map((a) => a.umaban));
  const rows = race.horses.map((h) => {
    const first = h.est.find((v) => v != null);
    const firstOdds = h.odds.find((v) => v != null);
    const lastOdds = h.odds.at(-1);
    return { ...h, gain: (h.est.at(-1) ?? first) - first, firstOdds, lastOdds };
  }).sort((a, b) => b.gain - a.gain);
  const maxGain = Math.max(1, ...rows.map((r) => r.gain));

  el.innerHTML = head + `
    <div class="stats">
      <div class="stat"><div class="k">単勝売上</div><div class="v">${man(pool)}</div></div>
      <div class="stat"><div class="k">監視開始から増えた分</div><div class="v">+${man(poolGain)}<small>${hms(race.times[0])}〜${hms(race.times.at(-1))}</small></div></div>
      <div class="stat"><div class="k">締切前アラート</div><div class="v">${flaggedPre.size}<small>頭</small></div></div>
      <div class="stat"><div class="k">締切後アラート</div><div class="v">${flaggedPost.size}<small>頭</small></div></div>
    </div>
    <p class="note">「入った額」は単勝売上とオッズからの推定。監視開始から多く入った順に並べています。</p>
    <table>
      <thead><tr>
        <th class="l">馬番</th><th class="l">馬名</th><th>人気</th>
        <th class="l">オッズ推移</th><th>開始時</th><th>現在</th><th>変化</th><th title="複勝オッズの下限">複勝(開始→現在)</th><th>着順</th>
        <th class="bar-cell">監視開始から入った額(推定)</th>
      </tr></thead>
      <tbody>${rows.map((r) => {
        const change = r.firstOdds && r.lastOdds ? r.lastOdds / r.firstOdds - 1 : null;
        const isFlag = flaggedPre.has(r.umaban);
        const isPostOnly = !isFlag && flaggedPost.has(r.umaban);
        const w = Math.max(0, (r.gain / maxGain) * 100);
        return `<tr class="${isFlag ? "flag" : ""}">
          <td class="l">${isFlag ? `<span class="flag-icon" title="締切前のアラートあり">⚠</span>` : isPostOnly ? `<span class="flag-icon post" title="締切後のアラートのみ">◷</span>` : ""}${Number(r.umaban)}</td>
          <td class="l">${esc(r.name)}</td>
          <td>${r.ninki ?? ""}</td>
          <td class="l">${spark(r.odds, race.times)}</td>
          <td>${r.firstOdds ?? "-"}</td>
          <td>${r.lastOdds != null ? `<strong>${r.lastOdds}</strong>` : r.firstOdds != null ? `<span class="up" title="途中でオッズが出なくなった(取消・除外)">除外</span>` : "-"}</td>
          <td class="${change <= -0.05 ? "down" : "up"}">${change == null ? "-" : change === 0 ? "±0%" : `${change > 0 ? "+" : ""}${Math.round(change * 100)}%`}</td>
          <td>${(() => {
            const f = r.fuku.filter((v) => v != null);
            if (f.length === 0) return "-";
            const fc = f.at(-1) / f[0] - 1;
            return `${f[0]}→${f.at(-1)} <span class="${fc <= -0.05 ? "down" : "up"}">${fc === 0 ? "" : `${fc > 0 ? "+" : ""}${Math.round(fc * 100)}%`}</span>`;
          })()}</td>
          <td>${rankBadge(race, r.umaban)}</td>
          <td class="bar-cell"><div class="bar-wrap">
            <div class="bar ${isFlag ? "flag" : ""}" style="width:${w.toFixed(1)}%"></div>
            <span class="bar-val">${r.gain > 0 ? "+" + man(r.gain) : "-"}</span>
          </div></td>
        </tr>`;
      }).join("")}</tbody>
    </table>`;
}

function renderFeed() {
  const all = state.races.flatMap((r) => r.alerts.map((a) => ({ ...a, race: r })))
    .sort((a, b) => b.at.localeCompare(a.at));
  const feed = document.getElementById("feed");
  if (all.length === 0) { feed.innerHTML = `<div class="empty">まだありません</div>`; return; }
  feed.innerHTML = all.map((a) => {
    const key = `${a.race.id}_${a.at}_${a.umaban}_${a.type}`;
    const fresh = !firstLoad && !seenAlerts.has(key);
    seenAlerts.add(key);
    const horse = a.race.horses.find((h) => h.umaban === a.umaban);
    const phase = a.phase === "pre" ? "pre" : "post";
    return `<div class="alert-item ${phase} ${fresh ? "fresh" : ""}" data-id="${a.race.id}">
      <div class="top"><span><span class="kind">${phase === "pre" ? "⚠" : "◷"} ${KIND[a.type] ?? a.type}</span> ${esc(a.race.label)}<span class="phase ${phase}">${PHASE[phase]}</span></span><span>${hms(a.at)}</span></div>
      <div class="body">${Number(a.umaban)}番 ${esc(horse?.name ?? "")}${rankBadge(a.race, a.umaban)}<br>${esc(a.text.replace(/^(大口|急落|じわじわ下落) /, ""))}</div>
    </div>`;
  }).join("");
  firstLoad = false;
}

// アラートの種類ごとに、1着・3着内・単勝100円ずつ買った場合の回収率。同じ馬への同じ種類のアラートは1回と数える
function renderScore() {
  const groups = [
    ["pre", "slide"], ["pre", "big"], ["pre", "drop"], ["post", "big"], ["post", "drop"],
  ];
  const seen = new Set();
  const stats = Object.fromEntries(groups.map(([p, t]) => [`${p}_${t}`, { n: 0, done: 0, win: 0, top3: 0, top3Known: 0, pay: 0 }]));
  for (const race of state.races) {
    for (const a of race.alerts) {
      const key = `${race.id}_${a.umaban}_${a.phase}_${a.type}`;
      if (seen.has(key) || !stats[`${a.phase}_${a.type}`]) continue;
      seen.add(key);
      const st = stats[`${a.phase}_${a.type}`];
      st.n++;
      if (!race.result) continue;
      const r = race.result.ranks[a.umaban];
      st.done++;
      if (r === 1) { st.win++; st.pay += race.result.tanshoPayout ?? 0; }
      if (r <= 3 || race.result.complete) { st.top3Known++; if (r <= 3) st.top3++; }
    }
  }
  const row = ([p, t]) => {
    const st = stats[`${p}_${t}`];
    const pending = st.n - st.done;
    return `<tr>
      <td class="l">${KIND[t]}</td>
      <td>${st.done}${pending ? `<span class="up">+${pending}</span>` : ""}</td>
      <td>${st.win}</td>
      <td>${st.top3Known ? `${st.top3}/${st.top3Known}` : "-"}</td>
      <td>${st.done ? `${Math.round(st.pay / st.done)}%` : "-"}</td>
    </tr>`;
  };
  document.getElementById("score").innerHTML = `
    <table>
      <thead><tr><th class="l">アラート</th><th>頭数</th><th>1着</th><th>3着内</th><th>単回収</th></tr></thead>
      <tbody>
        <tr class="grp"><td colspan="5">締切前(買える)</td></tr>
        ${groups.filter(([p]) => p === "pre").map(row).join("")}
        <tr class="grp"><td colspan="5">締切後(参考)</td></tr>
        ${groups.filter(([p]) => p === "post").map(row).join("")}
      </tbody>
    </table>
    <div class="foot">頭数の「+n」は結果待ち。単回収はアラートの出た馬の単勝を100円ずつ買った場合。数レースでは偶然の差が大きいので、何週かためてから判断してください。</div>`;
}

function render() {
  if (!state) return;
  const s = state.settings;
  document.getElementById("settings").textContent =
    `発走${s.windowMin}分前から監視 ・ 大口=${man(s.minYen)}以上 ・ 急落=約10分で${Math.round(s.drop * 100)}%以上 ・ じわじわ下落=締切前に${Math.round(s.slide * 100)}%以上`;
  renderList();
  renderMain();
  renderFeed();
  renderScore();
}

async function load() {
  const conn = document.getElementById("conn");
  try {
    const res = await fetch("/api/state", { cache: "no-store" });
    state = await res.json();
    conn.textContent = `更新 ${new Date().toLocaleTimeString("ja-JP")}`;
    conn.classList.remove("bad");
    render();
  } catch {
    conn.textContent = "監視スクリプトに接続できません(ターミナルで止まっていませんか?)";
    conn.classList.add("bad");
  }
}

document.addEventListener("click", (e) => {
  const item = e.target.closest("[data-id]");
  if (!item) return;
  selectedId = item.dataset.id;
  render();
});

setInterval(() => { document.getElementById("clock").textContent = new Date().toLocaleTimeString("ja-JP"); }, 1000);
setInterval(load, 5000);
load();
</script>
</body>
</html>
